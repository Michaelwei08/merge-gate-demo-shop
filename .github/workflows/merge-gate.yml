# Copy to .github/workflows/merge-gate.yml in the repo you want to protect,
# then make the "merge-gate" status a required check in branch protection.
#
# Secrets / variables:
#   secrets.MUSE_API_KEY   optional: without it the gate runs rules + ownership only
#   vars.OWNER_GITHUB      optional: {"owner@email": "github-login"}, lets a code owner override by approving on GitHub
#
# The PR's title and body are read from the event file by the gate, never interpolated into shell
# (interpolating ${{ github.event.pull_request.body }} into `run:` lets anyone inject shell commands).

name: "Merge Gate"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to check (manual run)"
        required: true
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  merge-gate:
    name: "Merge Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: git blame on the base side, and origin/<base>

      - name: Check out Merge Gate
        uses: actions/checkout@v4
        with:
          repository: prubinadmin/MergeGateAIEHackathon
          ref: cd49eeac31ec75466ba62fdc49f61d586388be85  # pinned: a teammate push to the gate repo cannot change the demo
          path: .merge-gate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pytest ./.merge-gate

      - name: Load the PR for a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "pr must be a number"; exit 1;; esac
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          python -c "import json,os; d=os.environ['RUNNER_TEMP']; json.dump({'pull_request': json.load(open(d+'/pr.json'))}, open(d+'/event.json','w'))"
          git fetch -q origin "pull/$PR/head"
          echo "GATE_EVENT=$RUNNER_TEMP/event.json" >> "$GITHUB_ENV"

      - name: Run the gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          OWNER_GITHUB: ${{ vars.OWNER_GITHUB }}
        # -I: never import from the PR's checkout (cwd), or a PR could ship its own merge_gate/ that always passes
        run: GITHUB_EVENT_PATH="${GATE_EVENT:-$GITHUB_EVENT_PATH}" python -I -m merge_gate ci --out gate_result.json

      - name: Keep the verdict report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-report
          path: gate_result.json
